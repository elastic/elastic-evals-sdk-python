# Orca dataset config for the Wix knowledge base corpus.
# Copied verbatim from orca's configs/etl/datasets/customer_support.yml (scoped to
# the single `wix_knowledge_base` corpus) so Arm A runs orca's real pipeline.
# GCS path resolved by orca: <gcs_root>/customer_support/wix_knowledge_base/wix_knowledge_base.csv
dataset: 'customer_support'
corpus:
  - name: 'wix_knowledge_base'
    validation_sample_size: 1000
    high_null_percentage_threshold: 50.0
    file_format: '.csv'
    indexing:
      batch_size: 500
      request_timeout: 300
      max_retries: 3
    cleaning:
      batch_size: 10000
      strip_whitespace: true
      normalize_dates: false
      handle_special_chars: true
      remove_duplicates: true
      clean_currency: false
      coerce_types: false
    indices:
      - wix_knowledge_base:
          - _id_field: 'id'
          - mappings:
              - _meta:
                  - description: 'Wix Help-Center articles for user query resolution on services like web development and hosting.'
              - properties:
                  - id:
                      - type: 'keyword'
                      - meta:
                          - description: 'Unique identifier for the knowledge article.'
                  - title:
                      - type: 'text'
                      - meta:
                          - description: 'The title of the knowledge base article.'
                      - copy_to:
                          - 'title_semantic_elser'
                          - 'title_semantic_jina'
                  - title_semantic_elser:
                      - type: 'semantic_text'
                      - meta:
                          - description: 'The title of the knowledge base article.'
                          - use_case: 'semantic search'
                  - title_semantic_jina:
                      - type: 'semantic_text'
                      - inference_id: '.jina-embeddings-v3'
                      - meta:
                          - description: 'The title of the knowledge base article.'
                          - use_case: 'semantic search'
                  - contents:
                      - type: 'text'
                      - meta:
                          - description: 'The full text content of the knowledge article.'
                      - copy_to:
                          - 'contents_semantic_elser'
                          - 'contents_semantic_jina'
                  - contents_semantic_elser:
                      - type: 'semantic_text'
                      - meta:
                          - description: 'The full text content of the knowledge article.'
                          - use_case: 'semantic search'
                  - contents_semantic_jina:
                      - type: 'semantic_text'
                      - inference_id: '.jina-embeddings-v3'
                      - meta:
                          - description: 'The full text content of the knowledge article.'
                          - use_case: 'semantic search'
                  - is_vetted:
                      - type: 'keyword'
                      - meta:
                          - description: 'Is article vetted by experts (yes or no).'
