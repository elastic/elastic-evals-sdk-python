[project]
name = "elastic-evals"
version = "0.1.0"
description = "Python SDK for running offline LLM evaluations"
readme = "README.md"
authors = [
    { name = "Srdjan Lulic", email = "srdjan.lulic@elastic.co" }
]
requires-python = ">=3.11"
license = "Elastic-2.0"
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
    "httpx>=0.25",
    "tenacity>=8.0",
    "aiohttp>=3.13.3",
]

[project.optional-dependencies]
runner = ["click>=8.0"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
]

[project.scripts]
elastic-evals = "elastic_evals.runner.cli.main:main"

[project.entry-points."elastic_evals.suites"]
agent-builder = "examples.agent_builder.suite_plugin:get_suite"
chatbot-rag-eval-example = "examples.chatbot_rag_app.suite_plugin:get_suite"
claude-code-eval = "examples.claude_code_eval.suite_plugin:get_suite"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elastic_evals", "examples"]
