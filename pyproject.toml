[project]
name = "elastic-evals"
version = "0.1.0"
description = "Python SDK for running offline LLM evaluations"
readme = "README.md"
authors = [
    { name = "Srdjan Lulic", email = "srdjan.lulic@elastic.co" }
]
requires-python = ">=3.11"
license = "Elastic-2.0"
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "elasticsearch>=8.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
    "httpx>=0.25",
    "tenacity>=8.0",
    "aiohttp>=3.13.3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "pre-commit"]
runner = ["click>=8.0"]
all = ["elastic-evals[dev,runner]"]

[project.scripts]
elastic-evals = "elastic_evals.runner.cli.main:main"

[project.entry-points."elastic_evals.suites"]
agent-builder = "examples.agent_builder.suite_plugin:get_suite"
chatbot-rag-eval-example = "examples.chatbot_rag_app.suite_plugin:get_suite"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elastic_evals", "examples"]
